<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="monospace" font-size="14">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowDown" markerWidth="7" markerHeight="10" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#333"/>
    </marker>
    <linearGradient id="encGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">AES-256-GCM</text>

  <rect x="20" y="55" width="440" height="460" rx="8" fill="url(#encGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="240" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">Encrypt</text>

  <rect x="40" y="100" width="400" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="118" text-anchor="middle" font-size="13" fill="#555">Key: ECDH shared secret (32 bytes)</text>
  <text x="240" y="133" text-anchor="middle" font-size="11" fill="#888">EVP_aes_256_gcm()</text>
  <line x1="240" y1="140" x2="240" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="40" y="200" width="400" height="35" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="216" text-anchor="middle" font-size="13" fill="#555">IV: RAND_bytes() 12 random bytes</text>
  <text x="240" y="231" text-anchor="middle" font-size="11" fill="#888">Unique per message, prepended to ciphertext</text>
  <line x1="240" y1="235" x2="240" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="60" y="270" width="180" height="50" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="150" y="293" text-anchor="middle" font-size="13" fill="#f57f17">Plaintext</text>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#888">[4B len] JSON body</text>

  <line x1="240" y1="320" x2="240" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="260" y="270" width="180" height="50" rx="4" fill="#eceff1" stroke="#78909c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="350" y="293" text-anchor="middle" font-size="12" fill="#546e7a">AAD (empty)</text>
  <text x="350" y="310" text-anchor="middle" font-size="11" fill="#999">附加认证数据</text>
  <line x1="350" y1="320" x2="350" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="140" y="350" width="200" height="55" rx="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="240" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">AES-256-GCM</text>
  <text x="240" y="392" text-anchor="middle" font-size="12" fill="#e8f5e9">Encrypt + Auth</text>

  <line x1="150" y1="405" x2="150" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <line x1="330" y1="405" x2="330" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="60" y="450" width="180" height="35" rx="4" fill="#ffcdd2" stroke="#e53935" stroke-width="1.5"/>
  <text x="150" y="473" text-anchor="middle" font-size="13" fill="#c62828">Ciphertext</text>

  <rect x="260" y="450" width="180" height="35" rx="4" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="350" y="473" text-anchor="middle" font-size="13" fill="#c62828">Auth Tag (16B)</text>

  <rect x="60" y="492" width="380" height="22" rx="4" fill="#eceff1" stroke="#78909c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="250" y="507" text-anchor="middle" font-size="11" fill="#546e7a">Wire: [12B IV] [Ciphertext] [16B Tag]</text>

  <line x1="464" y1="290" x2="490" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="477" y="305" text-anchor="middle" font-size="10" fill="#888">TCP</text>

  <rect x="500" y="55" width="440" height="460" rx="8" fill="url(#decGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="720" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">Decrypt</text>

  <rect x="520" y="100" width="400" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="118" text-anchor="middle" font-size="13" fill="#555">Key: Same ECDH shared secret (32 bytes)</text>
  <text x="720" y="133" text-anchor="middle" font-size="11" fill="#888">EVP_DecryptInit_ex(..., EVP_aes_256_gcm(), ...)</text>
  <line x1="720" y1="140" x2="720" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="520" y="200" width="400" height="55" rx="4" fill="#eceff1" stroke="#78909c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="720" y="218" text-anchor="middle" font-size="13" fill="#546e7a">Receive: [12B IV] [Ciphertext] [16B Tag]</text>

  <line x1="590" y1="255" x2="590" y2="320" stroke="#333" stroke-width="1.2" marker-end="url(#arrowDown)"/>
  <line x1="720" y1="255" x2="720" y2="320" stroke="#333" stroke-width="1.2" marker-end="url(#arrowDown)"/>
  <line x1="850" y1="255" x2="850" y2="320" stroke="#333" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <rect x="540" y="320" width="100" height="35" rx="4" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="590" y="343" text-anchor="middle" font-size="12" fill="#555">IV (12B)</text>

  <rect x="670" y="320" width="100" height="35" rx="4" fill="#ffcdd2" stroke="#e53935" stroke-width="1"/>
  <text x="720" y="343" text-anchor="middle" font-size="12" fill="#c62828">Ciphertext</text>

  <rect x="800" y="320" width="100" height="35" rx="4" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="850" y="343" text-anchor="middle" font-size="12" fill="#c62828">Tag (16B)</text>

  <line x1="590" y1="355" x2="590" y2="390" stroke="#333" stroke-width="1" marker-end="url(#arrowDown)"/>
  <line x1="720" y1="355" x2="720" y2="390" stroke="#333" stroke-width="1" marker-end="url(#arrowDown)"/>
  <line x1="850" y1="355" x2="850" y2="390" stroke="#333" stroke-width="1" marker-end="url(#arrowDown)"/>

  <rect x="620" y="390" width="200" height="55" rx="6" fill="#2196f3" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">AES-256-GCM</text>
  <text x="720" y="432" text-anchor="middle" font-size="12" fill="#e3f2fd">Decrypt + Verify Tag</text>

  <line x1="720" y1="445" x2="720" y2="480" stroke="#333" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <rect x="600" y="480" width="240" height="35" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="720" y="503" text-anchor="middle" font-size="13" fill="#f57f17">Plaintext (tag valid)</text>

  <text x="480" y="537" text-anchor="middle" font-size="12" fill="#666">
    GCM: GHASH(encrypted_aad || ciphertext || len(aad) || len(ciphertext)) XOR AES_K(IV || 0)
  </text>
</svg>
